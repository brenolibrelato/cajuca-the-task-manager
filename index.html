<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cajuca</title>
  <meta name="description" content="Cajuca — planejador de tarefas hierárquico com status automático, prazos e lembretes.">
  <!-- CSP: só o próprio site, o CDN do supabase-js e o servidor do Supabase. Estilos inline
       (atributo style) ainda são usados pela interface, por isso 'unsafe-inline' só em style. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://dtojmatylupzfhuyyltj.supabase.co wss://dtojmatylupzfhuyyltj.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
  <!-- tema escolhido antes de desenhar a página + aviso se o app não carregar -->
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#faf7f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141314" media="(prefers-color-scheme: dark)">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <noscript><p class="boot-error">O Cajuca precisa de JavaScript. / Cajuca needs JavaScript.</p></noscript>
  <p id="boot-error" class="boot-error" role="alert" hidden>
    Não foi possível carregar o app. Verifique a conexão e recarregue a página.<br>
    Could not load the app. Check your connection and reload the page.
  </p>

  <!-- Login -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="login-head">
        <h1><img class="logo logo-light" src="assets/logo.png" alt="Cajuca"><img class="logo logo-dark" src="assets/logo-dark.png" alt="Cajuca"></h1>
        <div class="prefs">
          <select class="theme-select" data-i18n-aria="top.theme"></select>
          <select class="lang-select" data-i18n-aria="top.language"></select>
        </div>
      </div>
      <p class="muted" data-i18n="app.subtitle"></p>
      <label><span data-i18n="login.email"></span><input type="email" name="email" required autocomplete="username"></label>
      <label><span data-i18n="login.password"></span>
        <span class="pw-wrap">
          <input type="password" name="password" id="login-pw" required autocomplete="current-password">
          <button type="button" id="pw-toggle" class="icon pw-toggle" aria-pressed="false" aria-controls="login-pw" data-i18n-aria="login.showPassword" data-i18n-title="login.showPassword"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </span>
      </label>
      <button class="primary" data-i18n="login.submit"></button>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="button" id="forgot" class="ghost" data-i18n="login.forgot"></button>
      <p id="login-info" class="muted" role="status" hidden></p>
    </form>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <h1><img class="logo logo-light" src="assets/logo.png" alt="Cajuca"><img class="logo logo-dark" src="assets/logo-dark.png" alt="Cajuca"></h1>
      <nav class="tabs">
        <button type="button" data-view="main" class="tab active" aria-pressed="true" data-i18n="top.tasks"></button>
        <button type="button" data-view="history" class="tab" aria-pressed="false" data-i18n="top.history"></button>
      </nav>
      <div class="user">
        <button type="button" id="pending-btn" class="icon bell" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="bell-count" aria-hidden="true" hidden></span>
        </button>
        <select class="theme-select" data-i18n-aria="top.theme"></select>
        <select class="lang-select" data-i18n-aria="top.language"></select>
        <span id="user-email" class="muted"></span>
        <button id="logout" class="ghost" data-i18n="top.logout"></button>
      </div>
    </header>

    <!-- resumo: contadores que aplicam o atalho correspondente (só na tela principal) -->
    <section id="summary" class="summary" data-i18n-aria="sum.title"></section>

    <section id="toolbar" class="toolbar">
      <button type="button" id="f-toggle" class="filters-toggle" aria-expanded="false" aria-controls="filters"><span data-i18n="filter.toggle"></span><span class="dot" aria-hidden="true" hidden></span></button>
      <div id="filters" class="filters">
        <label class="search"><span data-i18n="filter.search"></span>
          <input type="search" id="f-q" maxlength="200" autocomplete="off" data-i18n-placeholder="filter.searchHint">
        </label>
        <div class="field">
          <span data-i18n="filter.project"></span>
          <details id="f-projects" class="multi">
            <summary></summary>
            <div class="multi-panel"></div>
          </details>
        </div>
        <label><span data-i18n="filter.priority"></span>
          <select id="f-priority"></select>
        </label>
        <label><span id="f-period-label"></span>
          <select id="f-period"></select>
        </label>
        <label><span data-i18n="filter.assignee"></span>
          <select id="f-assignee"></select>
        </label>
        <button type="button" id="f-clear" class="ghost" data-i18n="filter.clear" hidden></button>
      </div>
      <span class="spacer"></span>
      <div class="tool-actions">
        <button type="button" id="export-csv" class="ghost" data-i18n="btn.exportCsv"></button>
        <button type="button" id="print" class="ghost" data-i18n="btn.print"></button>
        <button type="button" id="new-project" data-i18n="btn.newProject"></button>
        <button type="button" id="new-task" class="primary" data-i18n="btn.newTask"></button>
      </div>
    </section>

    <!-- atalhos de filtro (botões liga/desliga) -->
    <div id="chips" class="chips" role="group" data-i18n-aria="filter.shortcuts"></div>

    <div class="table-wrap">
      <table class="tasks">
        <colgroup>
          <col class="w-title"><col class="w-notes"><col class="w-prio"><col class="w-due">
          <col class="w-rem"><col class="w-who"><col class="w-status"><col class="w-act">
        </colgroup>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="loading" class="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span><span data-i18n="loading"></span></p>
      <p id="empty" class="empty" hidden></p>
    </div>
  </div>

  <dialog id="modal"></dialog>
  <!-- painel de pendências (atrasos, inatividade, lembretes) -->
  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
  <!-- menu "⋯" das linhas (um só, reposicionado a cada abertura) -->
  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="toast" class="toast" popover="manual" role="status" aria-live="polite" hidden></div>
</body>
</html>
